<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Jerkgram source integrity principles</title><desc id="desc">Three principles: exact source, verified export, release-bound provenance.</desc>
<rect width="1600" height="420" rx="40" fill="#f2efe8"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#10161e">
  <text x="80" y="94" font-size="24" font-weight="700" letter-spacing="6" opacity=".5">SOURCE INTEGRITY</text>
  <g transform="translate(80 145)"><text x="0" y="58" font-size="54" font-weight="760">EXACT</text><text x="0" y="112" font-size="28" opacity=".56">Production files stay unchanged.</text><line x1="0" y1="158" x2="400" y2="158" stroke="#10161e" stroke-opacity=".14"/></g>
  <g transform="translate(590 145)"><text x="0" y="58" font-size="54" font-weight="760">VERIFIED</text><text x="0" y="112" font-size="28" opacity=".56">Export fails on unsafe drift.</text><line x1="0" y1="158" x2="400" y2="158" stroke="#10161e" stroke-opacity=".14"/></g>
  <g transform="translate(1100 145)"><text x="0" y="58" font-size="54" font-weight="760">BOUND</text><text x="0" y="112" font-size="28" opacity=".56">Source is tied to a Stable IPA.</text><line x1="0" y1="158" x2="400" y2="158" stroke="#10161e" stroke-opacity=".14"/></g>
</g>
</svg>