name: Publish Jerkgram 1.2.0 source once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-source-once.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: jerkgram-v1.2.0-source-publish
  cancel-in-progress: false
jobs:
  publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.JERKGRAM_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.JERKGRAM_RELEASE_TOKEN || github.token }}
      - name: Verify green Build183 and retrieve its existing IPA
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = jerkgram/Jerkgram-iOS
          gh api repos/ghostbase-sg/jerkgram-telegram-builder/actions/runs/43516752691 > "$RUNNER_TEMP/build183.json"
          python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/build183.json'))
          assert r['conclusion']=='success' and r['head_sha']=='636decefd426586118c0a06de03d2d3c2cc24cde'
          PY
          mkdir -p "$RUNNER_TEMP/assets" "$RUNNER_TEMP/ipa"
          gh run download 43516752691 --repo ghostbase-sg/jerkgram-telegram-builder --name Jerkgram-1.2.0-Build183-STABLE --dir "$RUNNER_TEMP/ipa"
          cp "$RUNNER_TEMP/ipa/Jerkgram-1.2.0-Build183-STABLE.ipa" "$RUNNER_TEMP/assets/Jerkgram-1.2.0.ipa"
          echo '4c520eb3cf8cade914903a1cdc08f54c7b0dc73c8916dbec6361bfe8f76254f1  '"$RUNNER_TEMP/assets/Jerkgram-1.2.0.ipa" | sha256sum -c -
      - name: Reproduce locally verified public source snapshot without building app
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/ghostbase-sg/jerkgram-telegram-builder.git "$RUNNER_TEMP/builder"
          git -C "$RUNNER_TEMP/builder" checkout --detach 636decefd426586118c0a06de03d2d3c2cc24cde
          git init "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git -C "$RUNNER_TEMP/source" fetch --depth 1 origin 24638bc69bd083981b178dd1e7f921eebbf7fc46
          git -C "$RUNNER_TEMP/source" checkout --detach FETCH_HEAD
          # Dummy public-only inputs satisfy configuration generation; build-input is excluded.
          export JERKGRAM_TELEGRAM_API_ID=22732185
          export JERKGRAM_TELEGRAM_API_HASH=00000000000000000000000000000000
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,os.environ['RUNNER_TEMP']+'/builder/scripts')
          from materialize_jg132_product import materialize
          materialize(Path(os.environ['RUNNER_TEMP'])/'source')
          PY
          git -C "$RUNNER_TEMP/source" submodule update --init --recursive --depth 1 --jobs 8
          python3 .github/release-tools-120/package_source.py "$RUNNER_TEMP/builder" "$RUNNER_TEMP/source" "$RUNNER_TEMP/assets"
      - name: Verify assets, upload draft, install source, commit and tag, publish release
        run: |
          set -euo pipefail
          python3 .github/release-tools-120/publish_source.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/assets" .github/release-tools-120/expected.json
      - name: Preserve manifest if publication stops
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.2.0-source-manifest-review
          path: ${{ runner.temp }}/assets/public-source-manifest.json
          if-no-files-found: ignore
